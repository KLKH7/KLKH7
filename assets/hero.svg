<svg xmlns="http://www.w3.org/2000/svg" width="560" height="430" viewBox="0 0 560 430" role="img" aria-label="kian lakhani">
<style>
:root{--fg:#231F20;--mute:#8a8a8a;--acc:#115171;--bg:#FFFFFF;--line:#E6E6E6}
@media (prefers-color-scheme:dark){:root{--fg:#F2F2F2;--mute:#8b949e;--acc:#8AA9BD;--bg:#0d1117;--line:#30363d}}
.bg{fill:var(--bg);stroke:var(--line)}
.t{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--fg);white-space:pre;animation:in .01s linear backwards}
.c{fill:var(--mute)}.a{fill:var(--acc)}.b{font-weight:700}
.dot{fill:var(--line)}
.cur{fill:var(--acc);animation:blink 1s steps(1) infinite}
@keyframes in{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
<rect class="bg" x="0.5" y="0.5" width="559" height="429" rx="18"/>
